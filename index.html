<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To My Universe</title>
    <style>
        /* 引入更具人文气息的衬线字体 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');

        :root {
            --primary-glow: rgba(200, 220, 255, 0.8);
            --secondary-glow: rgba(255, 180, 180, 0.4);
            --bg-color: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            color: #eee;
            height: 100vh;
            width: 100vw;
            cursor: pointer;
            user-select: none;
        }

        /* === 电影质感滤镜层 === */
        /* 1. 噪点层：增加胶片颗粒感 */
        #grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 5;
            opacity: 0.6;
        }

        /* 2. 暗角层：模拟镜头边缘失光 */
        #vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 6;
        }

        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            /* 启用硬件加速 */
            transform: translate3d(0,0,0); 
        }

        /* === 内容层 === */
        #content-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: none;
            mix-blend-mode: screen; /* 关键：让文字与星空更好融合 */
        }

        .page-text {
            position: absolute;
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            filter: blur(10px);
            transform: scale(0.95);
            transition: opacity 1.5s ease, filter 1.5s ease, transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 800px;
            width: 90%;
            text-align: center;
        }

        /* 进场状态 */
        .page-text.active {
            opacity: 1;
            filter: blur(0px);
            transform: scale(1);
        }

        /* 退场状态：像电影淡出 */
        .page-text.out {
            opacity: 0;
            filter: blur(20px);
            transform: scale(1.1); /* 微微放大消失，更有沉浸感 */
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
        }

        /* 排版细节 */
        h1 { 
            font-size: clamp(2rem, 5vw, 4rem); 
            font-weight: 400; 
            margin-bottom: 2rem; 
            color: #fff;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px var(--primary-glow), 0 0 40px var(--primary-glow);
            line-height: 1.2;
        }

        p { 
            font-size: clamp(1rem, 2vw, 1.4rem); 
            line-height: 2.2; 
            font-weight: 200; 
            color: rgba(255,255,255,0.85);
            text-shadow: 0 0 5px rgba(0,0,0,0.8); /* 保证在星云背景上的可读性 */
            margin-bottom: 10px;
        }

        /* 强调文字：电影字幕风格 */
        .highlight { 
            color: #fff;
            font-style: italic;
            font-family: 'Playfair Display', serif;
            position: relative;
            padding: 0 5px;
            text-shadow: 0 0 10px #fff;
        }

        .date-container {
            border-top: 1px solid rgba(255,255,255,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding: 20px 40px;
            margin: 30px 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .date { 
            font-size: clamp(2.5rem, 6vw, 5rem); 
            font-family: 'Playfair Display', serif;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        /* 倒计时样式 */
        #timer-wrap {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        #timer {
            font-size: 8rem;
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            color: #fff;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 40px var(--primary-glow);
        }
        
        /* 倒计时背后的圆环 */
        .timer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        .timer-ring::before {
            content:''; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 底部极简提示 */
        .hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fade 2s infinite;
            z-index: 20;
            font-family: sans-serif;
        }
        @keyframes fade { 0%,100% { opacity: 0.2; } 50% { opacity: 0.6; } }

    </style>
</head>
<body>

    <!-- 电影质感滤镜 -->
    <div id="grain"></div>
    <div id="vignette"></div>

    <canvas id="starfield"></canvas>

    <div id="content-layer">
        <!-- P1 -->
        <div class="page-text active" id="p1">
            <h1>Our First New Year</h1>
            <p>虽然遗憾，此刻相隔两地</p>
        </div>

        <!-- P2 -->
        <div class="page-text" id="p2">
            <p>宇宙漫长而寂静</p>
            <div class="date-container">
                <div class="date">2025.11.16</div>
            </div>
            <p>直到这一天，星光才有了意义</p>
        </div>

        <!-- P3 -->
        <div class="page-text" id="p3">
            <h1>Everything</h1>
            <p style="margin-top: 2rem;">这是命运给我们的注脚</p>
            <p>很庆幸，我们成为了彼此生命中</p>
            <p><span class="highlight">离不开 也不想离开</span> 的存在</p>
        </div>

        <!-- P4 -->
        <div class="page-text" id="p4">
            <p>未来的路或许荆棘丛生</p>
            <h1 style="margin-top:30px; font-size: 2.5rem;">但只要🈶你在，我就不退后</h1>
        </div>

        <!-- P5 -->
        <div class="page-text" id="p5">
            <p>我不完美，或许偶尔还会惹你生气</p>
            <p>但在爱你这件事上</p>
            <p>我向你承诺绝对的 <span class="highlight">忠诚</span> 与 <span class="highlight">守护</span></p>
            <p style="margin-top:20px;">安心，我一直都在</p>
        </div>

        <!-- P6: 倒计时 -->
        <div class="page-text" id="p6">
            <p style="letter-spacing: 5px; margin-bottom: 20px;">READY FOR THE FUTURE?</p>
            <div id="timer-wrap">
                <div class="timer-ring"></div>
                <div id="timer">10</div>
            </div>
        </div>

        <!-- P7: 结局 -->
        <div class="page-text" id="p7">
            <h1 style="font-size: 4rem; margin-bottom: 1rem;">Happy New Year</h1>
            <p style="font-size: 1.5rem; letter-spacing: 3px;">我爱你，老婆</p>
        </div>
    </div>

    <div class="hint">TAP TO CONTINUE</div>

    <script>
        /**
         * 改进版 Starfield：包含背景云雾、多层星星和动态模糊
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        let meteors = []; // 流星数组
        
        // 核心参数
        let warpSpeed = 0.2; // 初始慢速漂浮
        let baseSpeed = 0.2;
        let burstMode = false; // 爆发模式（切换页面时）

        // 颜色配置
        const colors = [
            {r: 200, g: 220, b: 255}, // 蓝白
            {r: 255, g: 200, b: 200}, // 暖红
            {r: 255, g: 255, b: 255}  // 纯白
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                // 初始分布铺满屏幕，否则只有远处有星星
                this.z = initial ? Math.random() * width : width; 
                this.size = Math.random() * 2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.prevZ = this.z;
            }

            update() {
                this.prevZ = this.z;
                this.z -= warpSpeed * 30; // 移动速度

                if (this.z < 1) {
                    this.reset();
                    // 防止复位时立刻出现在屏幕中间突兀
                    this.z = width; 
                    this.prevZ = this.z;
                }
            }

            draw() {
                // 3D 投影
                const x = (this.x / this.z) * width/2 + width/2;
                const y = (this.y / this.z) * height/2 + height/2;
                
                // 上一帧位置（用于Motion Blur）
                const px = (this.x / this.prevZ) * width/2 + width/2;
                const py = (this.y / this.prevZ) * height/2 + height/2;

                const scale = (1 - this.z / width); // 越近越大
                const alpha = scale * scale; // 越近越亮

                if (x < 0 || x > width || y < 0 || y > height) return;

                ctx.beginPath();
                
                // 如果速度很快，画成线（Motion Blur）
                if (warpSpeed > 1) {
                    ctx.moveTo(px, py);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = `rgba(${this.color.r},${this.color.g},${this.color.b}, ${alpha})`;
                    ctx.lineWidth = scale * this.size;
                    ctx.stroke();
                } else {
                    // 速度慢，画成发光的圆点
                    ctx.arc(x, y, scale * this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color.r},${this.color.g},${this.color.b}, ${alpha})`;
                    ctx.fill();
                    
                    // 大星星加一点光晕
                    if (scale > 0.8) {
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'white';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        // 初始化星星
        for(let i=0; i<1500; i++) {
            stars.push(new Star());
        }

        // 背景星云绘制 (增加层次感)
        function drawNebula() {
            // 简单模拟几个缓慢移动的彩色光团
            const time = Date.now() * 0.0005;
            
            const gradient1 = ctx.createRadialGradient(
                width * 0.5 + Math.sin(time) * 100, 
                height * 0.5 + Math.cos(time) * 100, 
                0, 
                width * 0.5, 
                height * 0.5, 
                width
            );
            gradient1.addColorStop(0, 'rgba(20, 30, 60, 0.0)');
            gradient1.addColorStop(0.5, 'rgba(30, 40, 80, 0.15)');
            gradient1.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = gradient1;
            ctx.fillRect(0,0,width,height);
        }

        // 动画循环
        function animate() {
            // 拖尾效果，值越低拖尾越长
            ctx.fillStyle = 'rgba(5, 5, 5, 0.4)'; 
            ctx.fillRect(0, 0, width, height);

            drawNebula();

            // 速度平滑控制
            if (burstMode) {
                warpSpeed += (20 - warpSpeed) * 0.05; // 加速
            } else {
                warpSpeed += (baseSpeed - warpSpeed) * 0.05; // 减速回正常
            }

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();


        // === 逻辑控制 ===
        let currentPage = 1;
        const totalPages = 7;
        let isTransitioning = false;

        document.body.addEventListener('click', () => {
            if (isTransitioning) return;
            if (currentPage >= totalPages) return;
            if (currentPage === 6) return; // 倒计时页不可跳过

            nextPage();
        });

        function nextPage() {
            isTransitioning = true;
            
            // 触发视觉冲击
            burstMode = true; 
            document.body.style.cursor = 'wait';
            
            // 当前页淡出
            const currEl = document.getElementById(`p${currentPage}`);
            currEl.classList.remove('active');
            currEl.classList.add('out');

            currentPage++;

            // 1.2秒后（飞行结束）显示下一页
            setTimeout(() => {
                burstMode = false; // 减速
                document.body.style.cursor = 'pointer';

                const nextEl = document.getElementById(`p${currentPage}`);
                if (nextEl) {
                    nextEl.classList.add('active');
                }

                if (currentPage === 6) {
                    document.querySelector('.hint').style.display = 'none';
                    startCountdown();
                }

                isTransitioning = false;
            }, 1200);
        }

        function startCountdown() {
            let count = 10;
            const timerEl = document.getElementById('timer');
            
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    timerEl.innerText = count;
                    // 倒计时每一秒产生一次小的视觉冲击
                    warpSpeed = 5; 
                    setTimeout(()=> { warpSpeed = baseSpeed }, 300);
                } else {
                    clearInterval(interval);
                    timerEl.innerText = "0";
                    
                    // 结束，进入最后高潮
                    isTransitioning = true;
                    burstMode = true; // 极速穿越
                    
                    document.getElementById('p6').classList.remove('active');
                    document.getElementById('p6').classList.add('out');
                    
                    setTimeout(() => {
                        burstMode = false;
                        document.getElementById('p7').classList.add('active');
                        
                        // 最后一页不需要点击提示了
                    }, 1500);
                }
            }, 1000);
        }
    </script>
</body>
</html>
